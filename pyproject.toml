[project]
name = "hermes-dock"
version = "0.1.0"
description = "Central Hermes administrator dock governing siloed AI-agent observation decks"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes-dock = "hermes_dock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_dock*"]

[tool.setuptools.package-data]
hermes_dock = ["deck_templates/*.json"]
